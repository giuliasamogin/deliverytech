# Configuração do servidor
server.port=8080

# Configuração do H2 Database (usado só quando roda fora do Docker)
spring.datasource.url=jdbc:h2:mem:deliverydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 desligado (era uma porta aberta para ver o banco pelo navegador)
spring.h2.console.enabled=false

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações de desenvolvimento
spring.devtools.restart.enabled=true

# Segurança (JWT)
# Valor padrão SÓ para desenvolvimento local. No Docker o JWT_SECRET é obrigatório
# (veja application-docker.properties e o arquivo .env).
jwt.secret=${JWT_SECRET:dev-only-chave-local-nao-usar-em-producao-0123456789abcdef}
jwt.expiration=86400000

# Senha do usuário admin criado na inicialização (padrão só para dev local)
app.admin.password=${ADMIN_PASSWORD:admin-dev-local}

# Nível de log da aplicação
logging.level.root=INFO
logging.level.com.deliverytech=DEBUG

# --- observabilidade ---
spring.application.name=delivery-api

# Só estes endpoints do Actuator ficam disponíveis (antes havia uma linha que liberava todos)
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Detalhes da saúde (como o estado do banco) só aparecem para quem fez login
management.endpoint.health.show-details=when-authorized

management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans