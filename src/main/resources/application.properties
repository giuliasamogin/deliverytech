# Configuração do servidor
server.port=8080

# Configuração do H2 Database
spring.datasource.url=jdbc:h2:mem:deliverydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações de desenvolvimento
spring.devtools.restart.enabled=true

# Segurança (JWT)
# Valor padrão SÓ para desenvolvimento local. No Docker o JWT_SECRET é obrigatório
# (veja application-docker.properties e o arquivo .env).
jwt.secret=${JWT_SECRET:dev-only-chave-local-nao-usar-em-producao-0123456789abcdef}
jwt.expiration=86400000

# Senha do usuário admin criado na inicialização (padrão só para dev local)
app.admin.password=${ADMIN_PASSWORD:admin-dev-local}

# Expor todos os endpoints do Actuator
management.endpoints.web.exposure.include=*

# Mostrar detalhes do /actuator/health
management.endpoint.health.show-details=always

# Nível de log da aplicação
logging.level.root=INFO
logging.level.com.deliverytech=DEBUG

# --- observabilidade ---
spring.application.name=delivery-api
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans