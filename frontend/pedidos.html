<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alameda</title>
  
  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Estilos e Scripts -->
  <link rel="stylesheet" href="css/style.css">
  <script src="js/api.js"></script>
</head>
<body>

  <header id="nav"></header>

  <main>
    <h1>Meus pedidos</h1>
    <div id="m" class="msg"></div>
    <div id="g" class="grid"></div>
  </main>

  <script>
    nav();

    async function load() {
      try {
        const L = (await api('/pedidos/cliente/' + await cid())).sort((a, b) => b.id - a.id);
        
        $('g').innerHTML = L.map(p => `
          <div class="card">
            <div class="in">
              <h3>Pedido ${p.numeroPedido || '#' + p.id}</h3>
              <p class="muted">${p.nomeRestaurante || ''}</p>
              <p class="status">${ST[p.statusPedido] || p.statusPedido}</p>
              <p class="price">${brl(p.valorTotal)}</p>
              ${['ENTREGUE', 'CANCELADO'].includes(p.statusPedido) ? '' : `<button class="sec" onclick="canc(${p.id})">Cancelar pedido</button>`}
            </div>
          </div>
        `).join('') || '<p class="muted">Você ainda não fez pedidos. Escolha um restaurante para começar.</p>';
      } catch (x) {
        msg($('m'), x.message);
      }
    }

    async function canc(i) {
      try {
        await api('/pedidos/' + i, { method: 'DELETE' });
        load();
      } catch (x) {
        msg($('m'), x.message);
      }
    }

    if (guard('CLIENTE')) load();
  </script>

</body>
</html>
