<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alameda</title>

  <!-- Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">

  <!-- Estilos e Scripts -->
  <link rel="stylesheet" href="css/style.css?v=3">
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
</head>
<body>

  <header id="nav"></header>

  <main>
    <div id="topo" class="banner"></div>
    <div id="m" class="msg"></div>

    <div class="split">
      <div id="g"></div>

      <div class="side">
        <h3>Seu pedido</h3>
        <div id="cart" class="muted">Carrinho vazio</div>

        <label>Como receber</label>
        <select id="tp" onchange="$('en').style.display = this.value == 'e' ? '' : 'none'">
          <option value="e">Entrega</option>
          <option value="r">Retirada no local</option>
        </select>

        <input id="en" placeholder="Endereço de entrega">

        <label>Pagamento</label>
        <select id="pg">
          <option value="PIX">Pix</option>
          <option value="CARTAO">Cartão</option>
          <option value="DINHEIRO">Dinheiro</option>
        </select>

        <button onclick="fin()">Fazer pedido</button>
        <p class="muted" id="lg"></p>
      </div>
    </div>
  </main>

  <script>
    nav();
    const rid = new URLSearchParams(location.search).get('id');
    const s = sess();
    let P = [], C = {};

    (async () => {
      try {
        const R = await api('/restaurantes/' + rid);

        $('topo').innerHTML = capa(R.categoria, R.id, false, R.nome) + `
          <div class="in">
            <h1>${R.nome}</h1>
            <p class="muted">
              <span class="tag">${R.categoria || 'Restaurante'}</span>${R.endereco || ''}
            </p>
            <p class="muted">Entrega ${brl(R.taxaEntrega)}, em ${R.tempoEntrega || '?'} min</p>
          </div>`;

        P = (await api('/produtos'))
          .filter(p => p.restaurante && p.restaurante.id == rid && p.disponivel !== false);

        // Agrupa os pratos por categoria (Massas, Bebidas, ...)
        const grupos = {};
        P.forEach(p => {
          const c = p.categoria || 'Outros';
          (grupos[c] = grupos[c] || []).push(p);
        });

        $('g').innerHTML = Object.keys(grupos).map(c => `
          <h2>${c}</h2>
          <div class="pratos">
            ${grupos[c].map(p => `
              <div class="prato">
                <div class="info">
                  <h3>${p.nome}</h3>
                  <p class="price">${brl(p.preco)}</p>
                  <button class="sec" onclick="add(${p.id})">Adicionar</button>
                </div>
                ${capa(p.categoria, p.id, true, p.nome)}
              </div>
            `).join('')}
          </div>
        `).join('') || '<p class="muted">Este restaurante ainda está montando o cardápio.</p>';

        if (s && s.role == 'CLIENTE') {
          $('en').value = (await api('/clientes/' + await cid())).endereco || '';
        } else {
          $('lg').innerHTML = 'Para pedir, <a href="conta.html?tipo=cliente">entre ou crie sua conta</a>.';
        }
      } catch (x) {
        msg($('m'), x.message);
      }
    })();

    function add(i) {
      C[i] = (C[i] || 0) + 1;
      draw();
    }

    function rem(i) {
      C[i]--;
      if (!C[i]) delete C[i];
      draw();
      return false;
    }

    function draw() {
      let total = 0;
      const linhas = Object.keys(C).map(k => {
        const p = P.find(x => x.id == k);
        total += p.preco * C[k];
        return `<div class="linha">
          <span>${C[k]} × ${p.nome}</span>
          <a href="#" onclick="return rem(${k})">tirar um</a>
        </div>`;
      });

      $('cart').innerHTML = linhas.length
        ? linhas.join('') + '<p class="price">Subtotal ' + brl(total) + '</p>'
        : 'Carrinho vazio';
    }

    async function fin() {
      try {
        if (!s || s.role != 'CLIENTE') throw new Error('Entre como cliente para fazer o pedido.');
        if (!Object.keys(C).length) throw new Error('Adicione pelo menos um item.');

        await api('/pedidos', {
          method: 'POST',
          body: {
            clienteId: Number(await cid()),
            restauranteId: +rid,
            itens: Object.keys(C).map(k => ({ produtoId: +k, quantidade: C[k] })),
            enderecoEntrega: $('tp').value == 'e' ?$('en').value : 'Retirada no local',
            formaPagamento: $('pg').value
          }
        });

        location = 'pedidos.html';
      } catch (x) {
        msg($('m'), x.message);
      }
    }
  </script>

</body>
</html>
