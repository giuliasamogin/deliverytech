services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      MYSQL_DATABASE: delivery
    ports:
      # 127.0.0.1 = só o seu computador acessa o banco (antes, a rede inteira podia tentar)
      - "127.0.0.1:3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_SECRET=${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      - DB_PASSWORD=${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD no arquivo .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin
    ports:
      - "127.0.0.1:9411:9411"

  prometheus:
    image: prom/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

volumes:
  dbdata: